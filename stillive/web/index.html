<!-- Animations du choix Automatique (fidèle / surprise), même esprit que les trois voies. f1 f2 = Faire revivre, f3 f4 = Entrer. -->

<svg viewBox="0 0 100 80" aria-hidden="true" class="anim-voie">
<style>
.f1 *{transform-box:view-box}
.f1h{transform-origin:50px 38px;animation:f1h 6s infinite ease-in-out}
@keyframes f1h{0%,100%{transform:rotate(0)}22%{transform:rotate(-9deg)}44%{transform:rotate(0)}66%{transform:rotate(9deg)}88%{transform:rotate(0)}}

    <figure class="conseil"><svg viewBox="0 0 100 80" aria-hidden="true"><rect width="100" height="80" fill="#3A2A24"/><g transform="rotate(-6 50 40)"><rect x="22" y="14" width="56" height="52" fill="#fff"/><rect x="26" y="18" width="48" height="36" fill="#7FC8C4"/><circle cx="62" cy="28" r="6" fill="#FFC94A"/><path d="M26 54 l16 -16 l12 10 l8 -8 l12 14z" fill="#2E8C9A"/></g></svg><figcaption data-t="scan.conseil_plat"></figcaption></figure>

    <figure class="conseil"><svg viewBox="0 0 100 80" aria-hidden="true"><rect width="100" height="80" fill="#FFF4E2"/><circle cx="50" cy="22" r="26" fill="#FFC94A" opacity=".35"/><circle cx="50" cy="22" r="14" fill="#FFC94A" opacity=".55"/><rect x="20" y="52" width="60" height="22" fill="#3A2A24"/><rect x="30" y="50" width="40" height="18" fill="#fff" transform="rotate(-3 50 59)"/><g stroke="#E8573F" stroke-width="3" stroke-linecap="round"><line x1="8" y1="8" x2="26" y2="26"/><line x1="26" y1="8" x2="8" y2="26"/></g></svg><figcaption data-t="scan.conseil_lumiere"></figcaption></figure>
    <figure class="conseil"><svg viewBox="0 0 100 80" aria-hidden="true"><rect width="100" height="80" fill="#FFF4E2"/><rect x="30" y="4" width="40" height="72" rx="6" fill="#2B1D1A"/><rect x="33" y="9" width="34" height="62" fill="#3A2A24"/><rect x="35" y="14" width="30" height="52" fill="#fff"/><rect x="37" y="17" width="26" height="30" fill="#7FC8C4"/><path d="M37 47 l10 -12 l8 7 l8 -8 v13z" fill="#2E8C9A"/></svg><figcaption data-t="scan.conseil_cadre"></figcaption></figure>
  </div>
  <label class="gros-bouton centre" for="scan-prise" data-t="scan.prendre"></label>
  <button class="lien" id="scan-retour" type="button" data-t="scan.retour"></button>
  <input type="file" id="scan-prise" accept="image/*" capture="environment" hidden>
</main>

<main class="ecran" id="ecran-scan-cadre" hidden>
  <h2 class="titre-moyen" data-t="scan.cadre_titre"></h2>
  <p class="petit" id="scan-etat"></p>
  <div class="scan-cadre" id="scan-cadre" hidden>
    <img decoding="async" id="scan-image" alt="">
    <svg viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true"><polygon id="scan-polygone"></polygon></svg>
  </div>
  <div class="scan-alertes" id="scan-alertes" hidden>
    <p id="scan-alerte-texte"></p>
    <div class="scan-actions">
      <label class="bouton-trait" for="scan-prise" data-t="scan.refaire"></label>
      <button class="bouton-trait" id="scan-garder" type="button" data-t="scan.garder"></button>
    </div>
  </div>
  <p class="petit centre" id="scan-aide" data-t="scan.aide" hidden></p>
  <button class="gros-bouton" id="scan-valider" type="button" data-t="scan.valider" hidden></button>
  <label class="gros-bouton gros-bouton-clair centre" id="scan-reprendre" for="scan-prise" data-t="scan.reprendre"></label>
  <button class="lien" id="scan-annuler" type="button" data-t="scan.annuler"></button>
</main>

<!-- Recadrage plein écran (photo choisie ou bouton « Recadrer ») -->
<div class="recadrage" id="recadrage" role="dialog" aria-modal="true" hidden>
  <p class="rec-aide" data-t="recadrage.aide"></p>
  <div class="rec-scene" id="rec-scene">
    <div class="rec-image" id="rec-image">
      <canvas id="rec-canvas"></canvas>
      <div class="rec-cadre" id="rec-cadre"><i></i><i></i><i></i><i></i></div>
    </div>
  </div>
  <div class="rec-bas">
    <button class="gros-bouton rec-ok" id="rec-ok" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="recadrage.ok"></span></button>
    <button class="lien lien-discret" id="rec-annuler" type="button" data-t="recadrage.annuler"></button>
  </div>
</div>

<!-- 3. Attente -->
<main class="ecran" id="ecran-attente" hidden>
  <h1 class="titre"><span data-t="attente.titre1"></span> <em data-t="attente.titre2"></em></h1>
  <p class="manuscrit sous-titre" id="sous-titre-attente" data-t="attente.sous_titre"></p>
  <p class="carte-prep" id="file-attente" role="status" hidden></p>
  <div class="tirages" id="tirages"></div>
  <!-- 29/10 : avancement, petites phrases, ce qu'on a vu, puis « Créer un autre souvenir » en carte -->
  <div class="carte-progres">
    <div class="barre-gros" id="barre-attente"><i></i></div>
    <div class="ligne"><span id="etape" class="etape-cours"></span><strong id="restant"></strong></div>
    <ul class="etapes-faites" id="etapes-faites"></ul>
  </div>
  <div class="carte-attente carte-patience"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-sablier"/></svg><small data-t="attente.patience"></small><p class="astuce" id="astuce" aria-live="off"></p></div>
  <div class="mot carte-attente carte-idee-attente" id="idee-attente" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-etincelle"/></svg><small data-t="attente.idee"></small><strong></strong><span></span></div>
  <div class="mot carte-attente carte-vu" id="anecdote" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-loupe"/></svg><small data-t="attente.vu"></small><span class="manuscrit"></span></div>
  <button class="carte-autre" id="attente-autre" type="button"><span class="carte-autre-ic" aria-hidden="true"><svg viewBox="0 0 40 40"><use href="#ic-plus"/></svg></span><strong data-t="attente.autre"></strong><small data-t="attente.autre_d"></small><svg class="carte-autre-fleche" viewBox="0 0 40 40" aria-hidden="true"><use href="#ic-fleche"/></svg></button>
  <div class="attente-prevenir">
    <button class="bouton-trait" id="prevenir" type="button" data-t="attente.prevenir" hidden></button>
    <p class="petit" id="prevenu" data-t="attente.prevenu" hidden></p>
  </div>
</main>

<!-- 4. Résultat -->
<main class="ecran" id="ecran-resultat" hidden>
  <h1 class="titre"><span data-t="resultat.titre1"></span> <em data-t="resultat.titre2"></em></h1>
  <!-- Plusieurs souvenirs : on glisse du doigt (ou les flèches) pour passer de l'un à l'autre -->
  <div class="lecteur" id="lecteur">
    <figure class="pol grand"><video id="film" controls playsinline></video></figure>
    <button class="fleche fleche-gauche" id="film-precedent" type="button" data-t-label="resultat.precedent" hidden><svg viewBox="0 0 40 40" aria-hidden="true"><use href="#ic-fleche"/></svg></button>
    <button class="fleche" id="film-suivant" type="button" data-t-label="resultat.suivant" hidden><svg viewBox="0 0 40 40" aria-hidden="true"><use href="#ic-fleche"/></svg></button>
  </div>
  <p class="petit centre" id="film-position" hidden></p>
  <button class="bouton-trait remettre-son" id="remettre-son" type="button" data-t="resultat.remettre_son" hidden></button>
  <div class="formats" id="formats" role="group"></div>
  <p class="note" id="resultat-notes" hidden></p>
  <div class="deux-boutons" id="boutons-film">
    <button class="gros-bouton" id="partager-film" type="button" data-t="resultat.partager" hidden></button>
    <a class="gros-bouton" id="telecharger" download data-t="resultat.telecharger"></a>
  </div>
  <!-- Suite (29/10) : trois tuiles illustrées, la suppression à part, discrète. Le bouton « autre porte » est retiré
       (il doublait « Autre effet » et suivait la dernière porte ouverte, pas le film). -->
  <div class="actions-fin">
    <button class="action-fin action-effet" id="refaire" type="button" data-t-label="resultat.refaire"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-baguette"/></svg><span data-t="resultat.refaire_court"></span></button>
    <button class="action-fin action-galerie" id="vers-galerie" type="button" data-aller="galerie"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-souvenirs"/></svg><span data-t="resultat.tous"></span></button>
    <button class="action-fin action-accueil" id="vers-accueil" type="button" data-t-label="resultat.accueil"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-maison"/></svg><span data-t="resultat.accueil_court"></span></button>
  </div>
  <button class="action-supprimer" id="supprimer" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-corbeille"/></svg><span data-t="resultat.supprimer"></span></button>
</main>

<!-- 5. Mes souvenirs : tous les films de ce téléphone, à regarder -->
<main class="ecran" id="ecran-galerie" hidden>
  <button class="lien retour" type="button" data-aller="accueil" data-t="nav.retour"></button>
  <h1 class="titre-moyen" data-t="galerie.titre"></h1>
  <p class="petit" id="galerie-vide" data-t="galerie.vide" hidden></p>
  <div class="mur" id="mur"></div>
  <button class="tout-effacer centre-bloc" type="button" data-t="galerie.tout_effacer"></button>
</main>

<!-- Erreur -->
<main class="ecran" id="ecran-erreur" hidden>
  <h1 class="titre" data-t="erreur.titre"></h1>
  <p class="alerte" id="erreur-texte"></p>
  <details class="avance" id="erreur-detail" hidden>
    <summary data-t="erreur.detail_titre"></summary>
    <p class="petit" id="erreur-detail-texte"></p>
  </details>
  <button class="gros-bouton" id="reessayer" type="button" data-t="erreur.reessayer"></button>
  <button class="lien" id="erreur-forcer" type="button" data-t="erreur.forcer" hidden></button>
  <button class="lien lien-discret" id="erreur-supprimer" type="button" data-t="resultat.supprimer" hidden></button>
</main>

<!-- Code secret absent ou refusé : il faut scanner le code QR de l'ordinateur -->
<main class="ecran" id="ecran-cle" hidden>
  <h1 class="titre" data-t="cle.titre"></h1>
  <p class="alerte" data-t="erreur.cle_requise" role="alert"></p>
  <p class="petit" data-t="cle.aide"></p>
</main>

<!-- Boîte de confirmation (remplace confirm()) -->
<div class="voile" id="confirmation" hidden>
  <div class="boite" role="alertdialog" aria-modal="true" aria-labelledby="confirmation-texte">
    <p id="confirmation-texte"></p>
    <div class="boite-boutons">
      <button class="bouton-trait" id="confirmation-non" type="button" data-t="confirmer.non"></button>
      <button class="gros-bouton" id="confirmation-oui" type="button"></button>
    </div>
  </div>
</div>

<!-- Partager Stillive : code QR à montrer à quelqu'un d'autre (bouton à côté de la langue) -->
<div class="voile" id="partage-voile" hidden>
  <div class="boite" role="dialog" aria-modal="true" aria-labelledby="partage-titre">
    <h2 class="titre-moyen" id="partage-titre" data-t="partage.titre"></h2>
    <div class="qr" id="partage-qr" hidden></div>
    <p class="petit" id="partage-aide" data-t="partage.aide"></p>
    <p class="note-http" data-t="qr.non_securise"></p>
    <p class="alerte" id="partage-absent" data-t="partage.absent" hidden></p>
    <button class="bouton-trait" id="partage-fermer" type="button" data-t="partage.fermer"></button>
  </div>
</div>

<!-- La page continue plus bas : une flèche le dit (cachée dès qu'on fait défiler) -->
<!-- 29/10 : à GAUCHE (le pouce droit cachait la flèche), pastille « Fais défiler » aux premières visites, puis rond discret ;
     un léger dégradé en bas d'écran dit aussi qu'il y a une suite -->
<div class="voile-bas" id="voile-bas" aria-hidden="true" hidden></div>
<button class="plus-bas" id="plus-bas" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-chevron-bas"/></svg><span data-t="nav.plus_bas"></span></button>

<!-- Suivi des films (29/10) : petit message « Ton souvenir est prêt ! » en haut, et bulle-guide vers « Mes souvenirs » -->
<div class="toast-pret" id="toast-pret" role="status" hidden>
  <img decoding="async" class="toast-photo" id="toast-photo" alt="" hidden>
  <span class="toast-texte"><strong data-t="attente.pret_titre"></strong></span>
  <button class="toast-voir" id="toast-voir" type="button" data-t="suivi.regarder"></button>
  <button class="toast-fermer" id="toast-fermer" type="button" data-t-label="suivi.fermer">×</button>
</div>
<div class="guide-suivi" id="guide-suivi" role="status" hidden><span data-t="suivi.guide"></span></div>

<script src="/web/vendor/qrcode.js"></script>
<script src="/web/qr.js"></script>
<script src="/web/app.js"></script>
</body>
</html>
