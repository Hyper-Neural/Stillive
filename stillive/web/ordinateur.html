<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF4E2">
<title>Stillive</title>
<link rel="icon" href="/web/icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="/web/style.css">
</head>
<body class="ordi">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="ill-plage" viewBox="0 0 100 90"><rect width="100" height="90" fill="#7FC8C4"/><circle cx="76" cy="20" r="11" fill="#FFC94A"/><rect y="48" width="100" height="12" fill="#2E8C9A"/><rect y="60" width="100" height="30" fill="#F6D6A0"/><g fill="#E8573F"><rect x="8" y="44" width="5" height="22"/><rect x="18" y="44" width="5" height="22"/></g><g fill="#fff"><rect x="13" y="44" width="5" height="22"/><rect x="23" y="44" width="5" height="22"/></g><circle cx="54" cy="58" r="4" fill="#2B1D1A"/><rect x="50" y="62" width="8" height="12" rx="3" fill="#E8573F"/><circle cx="68" cy="60" r="3.5" fill="#2B1D1A"/><rect x="65" y="63" width="7" height="10" rx="3" fill="#2E8C9A"/><path d="M78 74 l8 -10 l8 10z" fill="#E9B872"/></symbol>
<symbol id="ill-anniv" viewBox="0 0 100 90"><rect width="100" height="90" fill="#F28B5B"/><g fill="#FFC94A" opacity=".55"><circle cx="12" cy="12" r="3"/><circle cx="88" cy="18" r="3"/><circle cx="30" cy="26" r="2"/><circle cx="72" cy="8" r="2"/></g><rect y="64" width="100" height="26" fill="#FFD966"/><rect x="30" y="46" width="40" height="20" rx="4" fill="#5A2E22"/><g fill="#E8573F"><circle cx="36" cy="48" r="2"/><circle cx="50" cy="47" r="2"/><circle cx="63" cy="48" r="2"/></g><g fill="#fff"><rect x="38" y="34" width="3" height="12"/><rect x="48.5" y="32" width="3" height="14"/><rect x="59" y="34" width="3" height="12"/></g><g fill="#FFE27A"><ellipse cx="39.5" cy="30" rx="2.5" ry="4"/><ellipse cx="50" cy="28" rx="2.5" ry="4"/><ellipse cx="60.5" cy="30" rx="2.5" ry="4"/></g><path d="M10 40 l7 -18 l7 18z" fill="#2E8C9A"/><path d="M78 42 l7 -18 l7 18z" fill="#7B5CC4"/></symbol>
<symbol id="ill-landau" viewBox="0 0 100 90"><rect width="100" height="90" fill="#CFE7C7"/><line x1="0" y1="18" x2="100" y2="14" stroke="#8A6A4A" stroke-width="1"/><rect x="14" y="16" width="12" height="14" fill="#fff"/><rect x="34" y="15" width="10" height="16" fill="#FFC94A"/><rect x="70" y="14" width="13" height="13" fill="#F28B5B"/><rect y="66" width="100" height="24" fill="#E9DCC4"/><path d="M28 60 a20 16 0 0 1 40 0z" fill="#7FA6C9"/><rect x="28" y="58" width="40" height="8" fill="#5E86AE"/><circle cx="36" cy="72" r="6" fill="none" stroke="#2B1D1A" stroke-width="2"/><circle cx="60" cy="72" r="6" fill="none" stroke="#2B1D1A" stroke-width="2"/><circle cx="52" cy="50" r="5" fill="#F2C9A8"/><circle cx="80" cy="44" r="5" fill="#F2C9A8"/><path d="M73 90 l7 -40 l7 40z" fill="#E8573F"/></symbol>
<symbol id="ill-soiree" viewBox="0 0 100 90"><rect width="100" height="90" fill="#3B2A5C"/><path d="M0 10 Q25 22 50 10 T100 10" fill="none" stroke="#FFE27A" stroke-width="1"/><g fill="#FFC94A"><circle cx="10" cy="14" r="2"/><circle cx="30" cy="17" r="2" fill="#E8573F"/><circle cx="50" cy="10" r="2"/><circle cx="70" cy="16" r="2" fill="#7FC8C4"/><circle cx="90" cy="13" r="2" fill="#E8573F"/></g><circle cx="50" cy="32" r="9" fill="#C9C3D9"/><g stroke="#3B2A5C" stroke-width=".8"><line x1="41" y1="32" x2="59" y2="32"/><line x1="50" y1="23" x2="50" y2="41"/><line x1="44" y1="26" x2="56" y2="38"/></g><g fill="#FFE27A" opacity=".7"><path d="M22 40 l3 -6 l3 6z"/><path d="M76 44 l3 -6 l3 6z"/></g><rect y="72" width="100" height="18" fill="#2A1E44"/><circle cx="30" cy="54" r="5" fill="#F2C9A8"/><rect x="25" y="59" width="10" height="16" rx="3" fill="#E8573F"/><path d="M26 61 l-8 -12" stroke="#F2C9A8" stroke-width="3" stroke-linecap="round"/><path d="M34 61 l8 -12" stroke="#F2C9A8" stroke-width="3" stroke-linecap="round"/><circle cx="66" cy="56" r="5" fill="#C98E6B"/><rect x="61" y="61" width="10" height="14" rx="3" fill="#2E8C9A"/><path d="M70 63 l9 -10" stroke="#C98E6B" stroke-width="3" stroke-linecap="round"/><path d="M84 40 l2 5 l5 1 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -1z" fill="#fff"/></symbol>
</defs></svg>

<header class="barre">
  <span class="logo"><span class="nom-logo">St<svg class="illi" viewBox="0 0 88 100" aria-hidden="true"><rect x="4" y="30" width="10" height="48" rx="2" fill="#2B1D1A"/><rect x="28" y="4" width="10" height="74" rx="2" fill="#2B1D1A"/><rect x="50" y="4" width="10" height="74" rx="2" fill="#2B1D1A"/><rect x="74" y="30" width="10" height="48" rx="2" fill="#2B1D1A"/><ellipse class="oeil" cx="9" cy="16" rx="6" ry="8" fill="#2E8C9A"/><ellipse class="oeil" cx="79" cy="16" rx="6" ry="8" fill="#2E8C9A"/><path d="M26 86 Q44 98 62 86" fill="none" stroke="#E8573F" stroke-width="5" stroke-linecap="round"/></svg>ve</span></span>
  <button class="langue" id="langue" type="button" data-t-label="langue.changer">FR</button>
</header>

<!-- Préparation de Stillive sur l'ordinateur : vérification, installation, code QR du téléphone -->
<main class="ecran" id="ecran-pc">
  <h1 class="titre-moyen" data-t="pc.titre"></h1>
  <div class="scene" aria-hidden="true">
    <figure class="pol flotte" style="--r:-10deg;left:4%;top:0"><svg viewBox="0 0 100 90"><use href="#ill-soiree"/></svg></figure>
    <figure class="pol flotte" style="--r:9deg;right:4%;top:-14px;animation-delay:1s"><svg viewBox="0 0 100 90"><use href="#ill-landau"/></svg></figure>
    <figure class="pol ejecte"><svg viewBox="0 0 100 90"><use href="#ill-anniv"/></svg></figure>
    <div class="appareil">
      <span class="arcenciel"><i></i><i></i><i></i><i></i></span>
      <span class="objectif"><span></span></span>
      <span class="flash"></span>
    </div>
  </div>
  <p data-t="pc.intro"></p>
  <p class="petit" id="pc-chargement" role="status" data-t="pc.chargement"></p>
  <p class="petit" id="pc-verif" hidden></p>

  <!-- Ordinateur qui ne convient pas -->
  <div class="ecran-bloc" id="bloc-incompat" hidden>
    <p class="alerte" id="pc-incompat" role="alert"></p>
    <p class="petit" data-t="pc.incompatible_aide"></p>
  </div>

  <!-- Express : un seul gros bouton -->
  <div class="ecran-bloc" id="bloc-express" hidden>
    <p id="pc-deja" hidden></p>
    <p id="pc-va-telecharger"></p>
    <ul class="ordi-liste" id="pc-liste"></ul>
    <p class="petit" id="pc-total"></p>
    <p class="alerte" id="pc-disque" hidden></p>
    <button class="gros-bouton" id="pc-preparer" type="button" data-t="pc.preparer"></button>
    <p class="petit" data-t="pc.patience"></p>
  </div>

  <!-- Installation en cours -->
  <div class="ecran-bloc" id="bloc-progres" hidden>
    <div class="barre-gros"><i id="pc-barre"></i></div>
    <div class="ligne"><span id="pc-etape"></span><strong id="pc-chiffres"></strong></div>
    <p class="petit" id="pc-fichier"></p>
    <p class="petit" data-t="pc.reprise"></p>
  </div>

  <p class="alerte" id="pc-message" role="alert" hidden></p>
  <p class="petit" id="pc-erreur-aide" data-t="pc.erreur_reprise" hidden></p>
  <button class="bouton-trait" id="pc-reessayer" type="button" data-t="moteur.reessayer" hidden></button>

  <!-- Tout est prêt : code QR du téléphone -->
  <div class="bloc-qr" id="bloc-pret" hidden>
    <h2 class="etiquette-titre" data-t="pc.pret"></h2>
    <p class="petit" id="pc-actuel"></p>
    <p class="alerte" id="pc-reco" hidden></p>
    <h3 class="titre-moyen" data-t="pc.qr_titre"></h3>
    <div class="qr" id="pc-qr" hidden></div>
    <p class="manuscrit sous-titre centre" id="pc-qr-aide" data-t="pc.qr_aide"></p>
    <p class="petit" id="pc-qr-ou" data-t="pc.qr_ou" hidden></p>
    <p class="adresse-pc" id="pc-adresse" hidden></p>
    <p class="petit" id="pc-qr-absent" data-t="pc.qr_absent" hidden></p>
    <details class="avance aide-tel" id="pc-aide-tel">
      <summary data-t="pc.aide_tel.titre"></summary>
      <div class="avance-corps">
        <p class="petit" data-t="pc.aide_tel.wifi"></p>
        <p class="petit" data-t="pc.aide_tel.pare_feu"></p>
        <p class="petit" data-t="pc.aide_tel.favori"></p>
      </div>
    </details>
    <!-- « Entrer dans l'image » demande des modèles à part : un bouton visible quand le reste est prêt -->
    <button class="bouton-trait" id="pc-ref2va" type="button" hidden></button>
  </div>

  <!-- Réglages avancés -->
  <details class="avance" id="bloc-avance">
    <summary data-t="pc.avance"></summary>
    <div class="avance-corps">
      <div class="ecran-bloc" id="av-llm-bloc">
        <label class="interrupteur"><input type="checkbox" id="av-llm" checked><span><span data-t="pc.av.llm"></span><small data-t="pc.av.llm_aide"></small></span></label>
        <div class="ecran-bloc" id="av-quant-bloc">
          <h2 class="etiquette-titre" data-t="pc.av.taille"></h2>
          <p class="petit" data-t="pc.av.taille_aide"></p>
          <div class="pastilles" id="av-quants" role="group"></div>
          <p class="alerte" id="av-pas-conseille" data-t="pc.av.pas_conseille" hidden></p>
        </div>
      </div>
      <label class="interrupteur"><input type="checkbox" id="av-h3" checked><span><span data-t="pc.av.h3"></span><small data-t="pc.av.h3_aide"></small></span></label>
      <p class="alerte" id="av-h3-non" data-t="pc.av.h3_non" hidden></p>
      <label class="interrupteur"><input type="checkbox" id="av-ref2va"><span><span id="av-ref2va-texte"></span><small data-t="pc.av.ref2va_aide"></small></span></label>
      <p class="petit" id="av-essayer-aide" data-t="pc.av.essayer_aide" hidden></p>
      <button class="bouton-trait" id="av-lancer" type="button"></button>

      <div class="ecran-bloc" id="moteur-detectes"></div>
      <button class="lien" id="moteur-autre-lien" type="button" data-t="moteur.autre"></button>
      <div class="ecran-bloc" id="moteur-autre" hidden>
        <label class="champ"><span data-t="moteur.adresse"></span><input type="text" id="moteur-url" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false"></label>
        <label class="champ"><span data-t="moteur.modele"></span><input type="text" id="moteur-modele" autocapitalize="off" autocomplete="off" spellcheck="false"></label>
        <button class="bouton-trait" id="moteur-tester" type="button" data-t="moteur.tester"></button>
      </div>
      <p class="alerte" id="av-message" role="alert" hidden></p>
    </div>
  </details>

  <!-- Désinstaller Stillive : on choisit ce qu'on retire (seulement ce que Stillive a installé) -->
  <details class="avance" id="bloc-desinst">
    <summary data-t="pc.desinstaller.titre"></summary>
    <div class="avance-corps">
      <p data-t="pc.desinstaller.intro"></p>
      <p class="petit" data-t="pc.desinstaller.rassure"></p>
      <div class="ecran-bloc" id="ds-liste"></div>
      <p class="petit" id="ds-rien" data-t="pc.desinstaller.rien" hidden></p>
      <p class="petit" id="ds-reglages-note" data-t="pc.desinstaller.reglages_note" hidden></p>
      <p class="petit" data-t="pc.desinstaller.ancien"></p>
      <p class="petit" data-t="pc.desinstaller.paquets"></p>
      <button class="bouton-trait" id="ds-bouton" type="button" data-t="pc.desinstaller.bouton" disabled></button>
      <div class="ecran-bloc" id="ds-confirme" hidden>
        <p class="alerte" id="ds-confirme-texte" role="alert"></p>
        <button class="gros-bouton" id="ds-oui" type="button" data-t="pc.desinstaller.oui"></button>
        <button class="bouton-trait" id="ds-non" type="button" data-t="pc.desinstaller.non"></button>
      </div>
      <div class="ecran-bloc" id="ds-resultat" role="status" hidden></div>
      <p class="petit" id="ds-comfy"></p>
    </div>
  </details>
</main>

<script src="/web/vendor/qrcode.js"></script>
<script src="/web/qr.js"></script>
<script src="/web/ordinateur.js"></script>
</body>
</html>
